
<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Search Engine</title>
    <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/wcAAgMBApWzZ/AAAAAASUVORK5CYII=" type="image/png">
    <link rel="stylesheet" href="styles.css">
    
    <script src="app.js"></script>
</head>
<body>
    <div id="container">
        

        <header>
            <h1>My Search Engine</h1>
        </header>
        

        <main>
            <section id="search-section">
                <p>Search for information</p>
                <form action="https://duckduckgo.com" method="get">
                    <input type="hidden" name="s" value="5528002566601475">
                    <div class="search-container">
                        <svg class="search-icon" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
                        </svg>
                        <input type="text" id="search-input" name="q" placeholder="Enter your search query..." autocomplete="off" required>
                        <button type="submit" id="search-button">Search</button>
                    </div>
                </form>
            </section>
        </main>

        
        <footer>
            <p>Made by Ayansh Pathak. Inspired by www.com</p>
        </footer>
    </div>
</body>
</html>
